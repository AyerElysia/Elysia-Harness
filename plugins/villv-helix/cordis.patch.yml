# Elysia/VillV-Helix: one bundle row owning the Host service and the Web page.
#
# The tool-face plugin owns session-scoped tool restrictions, static/custom
# tool semantics, managed extension mounts, the tool/preset views, and the
# tool-editing-mode capsule. It registers no business tools and has no
# global/preset switch.
#
# Context subscriptions, queues, injection logs, and health live elsewhere:
# context events are owned by @elysia/context-gate.
#
# `stateDir` holds the per-session tool face and the shared tool-group preset
# library.
- insert:
    - id: elysia-villv-helix
      name: '@elysia/villv-helix'
      config:
        stateDir: !!js dshHomePath('villv-helix')