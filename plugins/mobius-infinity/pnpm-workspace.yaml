# This plugin is developed and tested outside the vendored `dsh/` workspace, so
# it is its own single-package workspace. `devDependencies` reach the vendored
# sources with `link:` instead of `workspace:`; `tsdown.config.ts` and
# `vitest.config.ts` import the official DSH build/test presets by relative path.
packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false

# Nothing here ships a native or install-script payload.
onlyBuiltDependencies: []
