# Host row of the preset manager.
#
# The manager document lives under the harness home, beside `sessions/` and
# `storages/`, so deleting a home removes the roster it owns with it. The
# browser half is declared by `dsh.client` in package.json; the `prompt-files`
# child is mounted per preset by the Host service, never as a row here.
#
# `global` is only the first-run seed for the capability core's global switch
# "为模型全局注入预设管理工具". It stays false here: installing the plugin adds
# no tool to any session. The plugin publishes both tools as global catalog
# entries; the shared @elysia/capability-core owns the global state, gate,
# guard, and persistence. The plugin mounts that core itself when no panel or
# explicit core row has mounted it, so the panel is optional. Switch-off leaves
# the entries available for per-preset enabling in the Capabilities panel.
- insert:
    - id: elysia-preset-manager
      name: '@elysia/preset-manager'
      config:
        stateDir: !!js dshHomePath('preset-manager')
        global: false
