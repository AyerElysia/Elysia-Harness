# The Elysia conscious mind as a profile bundle: the standing-prompt prefix,
# the send_text tool, and the inbound pending queue. Requires `systemPrompt`;
# the tool attaches when the profile also provides `tools`.

# Web presets disable the base host-plane filesystem tools. The conscious mind
# keeps the existing global read_image baseline. Text and search tools are
# mounted only by the agent-scoped file-capabilities plugin.
- id: tool-fs
  disabled: false
  config:
    read: false
    readImage: true
    write: false
    edit: false

- insert:
    - id: elysia-conscious-mind
      name: '@elysia/conscious-mind'
      config:
        baseDir: !!js process.env.ELYSIA_PROMPTS_DIR ?? 'Data/standing-prompts'
        files:
          - SOUL.md
          - USER.md
          - MEMORY.md
          - EXISTENCE.md
          - TOOLS.md
