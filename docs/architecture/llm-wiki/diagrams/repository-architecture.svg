<text x="64" y="82" font-size="43" font-weight="700" fill="#152a43" text-anchor="start">nashsu/llm_wiki 的架构</text>
<text x="66" y="124" font-size="22" font-weight="400" fill="#465b73" text-anchor="start">桌面应用在本地维护 Markdown 项目。编辑界面、剪藏扩展和外部 Agent 通过不同入口使用它。</text>
<polyline points="64,930 1536,930" fill="none" stroke="#cbd9e7" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
<text x="65" y="962" font-size="16" font-weight="400" fill="#465b73" text-anchor="start">依据 nashsu/llm_wiki 提交 e08cfce · 入口和模块已核对 README、Ingest 与 API/MCP 源码。</text>
