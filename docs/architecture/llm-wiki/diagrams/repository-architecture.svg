<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="986" viewBox="0 0 1600 986" role="img" aria-labelledby="title desc">
<title id="title">nashsu/llm_wiki 的架构</title><desc id="desc">桌面应用在本地维护 Markdown 项目。编辑界面、剪藏扩展和外部 Agent 通过不同入口使用它。</desc>
<style>text {font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1600" height="986" rx="0" fill="#f3f7fb"/>
