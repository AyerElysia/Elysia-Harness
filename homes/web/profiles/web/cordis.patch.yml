# Local web profile patch.
# ElyH feature plugins are archived under plugins/_archive-elysia-v1 and are
# intentionally unmounted here. Only the external plugins remain:
# modsearch, remote-web-ui, market, billion-context. Core DSH/Web rows stay.
#
# Provider ids and model ids below are deployment values, not tracked ones:
# they must be declared by the operator in the untracked home-level
# `homes/shared/models.patch.yml`. A checkout without that file mounts nothing
# but fails to resolve the model at the first request.

# ModSearch supplies real structured search results without an official key.
# web_fetch continues to use the original anonymous HTTP provider.
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: modsearch
    fetchProvider: http
# Keep the exposed capability identical to the pre-ModSearch web tools. The
# optional settings route does not inherit DSH connection authentication.
- id: modsearch
  name: '@liustack/modsearch'
  config:
    searchProvider: true
    xSearch: false
    readPage: false
    settingsCard: false

- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

- insert:
    - id: remote-web-ui
      name: "@linxin666/dsh-remote-web-ui"
      config:
        autoTunnel: false
        publicBaseUrl: "https://climb-writing-bidder-here.trycloudflare.com"
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: verbose

# The main-owner plan gate mounts the same native Schedule Host after setup.
- id: schedule
  disabled: true

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: d1api
    model: deepseek-v4.1-flash-1017
    reasoningEffort: low

# ── Model providers ─────────────────────────────────────────────────────────
# This is the single tracked source of truth. The home layer is applied after
# this profile layer, so it must not repeat llm-pi-ai or agent-default-model;
# otherwise Settings edits saved here are shadowed at boot.
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      nexus-a6-gemini:
        displayName: NexusAI - A6 Gemini
        apiKeyEnv: NEXUSAI_GEMINI_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:3000/v1
        models:
          - id: gemini-3.8-flash
            name: Gemini 3.8 Flash
            contextWindow: 1000000
            maxTokens: 8192
            input:
              - text
              - image
        compat:
          supportsStore: false
          supportsDeveloperRole: false
          supportsReasoningEffort: false
          supportsUsageInStreaming: true
          maxTokensField: max_tokens
      d1api:
        displayName: d1api
        apiKeyEnv: D1API_API_KEY
        api: openai-completions
        baseURL: https://d1api.xin/v1
        models:
          - id: deepseek-v4.1-flash-1017
            name: deepseek-v4.1-flash-1017
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              high: high
              max: max
              low: low
            compat:
              chatTemplateKwargs: {}
              chatTemplateArgs: {}
        modelOverrides: {}
        compat:
          chatTemplateKwargs: {}
          chatTemplateArgs: {}
        defaultContextWindow: 262144
        defaultMaxTokens: 32768
        defaultInput:
          - text
        headers: {}
        thinkingBudgets: {}
        streamIdleTimeoutMs: 300000
        maxRequestImageBytes: 20971520
        requestImagePixelBudget: 4194304
        requestImageMaxBytes: 1048576
        maxRequestImages: 12
      a6:
        displayName: A6 - DeepSeek
        apiKeyEnv: A6API_API_KEY
        api: openai-completions
        baseURL: https://cf.a6api.net/v1
        models:
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash (A6)
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              high: high
              max: max
        compat:
          supportsStore: false
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          supportsUsageInStreaming: true
          maxTokensField: max_tokens
        timeoutMs: 1200000
        streamIdleTimeoutMs: 1200000
        maxRequestImageBytes: 20971520
        requestImagePixelBudget: 4194304
        requestImageMaxBytes: 1048576
        maxRequestImages: 12
