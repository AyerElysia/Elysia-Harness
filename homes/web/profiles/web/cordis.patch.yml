# The web surface's own patch layer, applied after every bundle layer.
#
# These rows mount Elysia's plugins. They resolve from the checkout's workspace,
# so no profile install is needed: `dsh/pnpm-workspace.yaml` carries
# `../plugins/*` and the installation anchor reaches it.

- insert:
    - id: elysia-conscious-mind
      name: '@elysia/conscious-mind'
      config:
        baseDir: !!js process.env.ELYSIA_PROMPTS_DIR ?? process.env.DSH_HOME +
          '/standing-prompts'
        files:
          - SOUL.md
          - USER.md
          - MEMORY.md
          - EXISTENCE.md
          - TOOLS.md

    # Channels stay off until an adapter config exists on this host; each reads
    # an absolute Elysium path and fails loud when it is absent, which would take
    # the whole profile down at boot.
    - id: elysia-qq-napcat
      name: '@elysia/qq-napcat'
      disabled: !!js process.env.ELYSIA_NAPCAT_CONFIG === undefined
      config:
        configPath: !!js process.env.ELYSIA_NAPCAT_CONFIG ?? ''
        port: 0

    - id: elysia-feishu-app
      name: '@elysia/feishu-app'
      disabled: !!js process.env.ELYSIA_FEISHU_CONFIG === undefined
      config:
        configPath: !!js process.env.ELYSIA_FEISHU_CONFIG ?? ''
        listen: false

    - id: elysia-kook-bot
      name: '@elysia/kook-bot'
      disabled: !!js process.env.ELYSIA_KOOK_CONFIG === undefined
      config:
        configPath: !!js process.env.ELYSIA_KOOK_CONFIG ?? ''
        # One token keeps one gateway. Opening it here replaces the socket the
        # live Python Elysium holds, so listen only turns on through an explicit
        # ELYSIA_KOOK_LISTEN=1 after that adapter has been stood down.
        listen: !!js process.env.ELYSIA_KOOK_LISTEN === '1'

    - id: elysia-request-archive
      name: '@elysia/request-archive'
      config:
        dir: !!js process.env.ELYSIA_REQUESTS_DIR ?? process.env.DSH_HOME + '/requests'


# The Ayla channel dials the Ayla backend and opens no port of its own.
# This row sits at the top level on purpose: the configuration editor addresses
# only top-level entries, so a row nested inside an `insert:` block would never
# persist a settings-page edit. The plugin mounts unconditionally so the
# settings page can render its fields; it opens no socket until username and
# password are both set. Env values only seed the defaults on first load.
- id: elysia-ayla-app
  name: '@elysia/ayla-app'
  config:
    baseUrl: !!js process.env.AYLA_BASE_URL ?? 'http://127.0.0.1:8100'
    # Written once by the settings page; the env var still seeds a fresh checkout.
    username: elysia
    password: !!js process.env.AYLA_BOT_PASSWORD ?? ''
    mode: auto
    workspaceDir: ''
