packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false

# Build scripts pnpm refuses until reviewed. cloudflared fetches the tunnel
# binary; the DSH native helpers need their postinstall. The rest are optional
# backends whose scripts we do not rely on.
allowBuilds:
  cloudflared: true
  koffi: true
  node-pty: true
  "@deepseek-ai/dsh-subprocess-local": true
  "@google/genai": false
  protobufjs: false
  # dsh-market is fetched from git, so its build runs at install time.
  "dshmarket@https://codeload.github.com/dsh-market/dsh-market/tar.gz/a05f16d73de3dc5a7c6c6c5c7a18d45dfc2e2c6a": true
